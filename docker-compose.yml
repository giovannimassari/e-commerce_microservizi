services:
  # ---------------------------------------------------------------- infrastruttura
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ordini_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"   # accesso dall'host (dotnet run in locale)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # INTERNAL: usato dagli altri container (kafka:29092); EXTERNAL: usato dall'host (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------- microservizi
  utenti-webapi:
    build:
      context: .
      dockerfile: src/Services/Utenti/Utenti.WebApi/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: ecommerce-utenti-webapi
    ports:
      - "5142:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UtentiDb: "Host=postgres;Port=5432;Database=utenti_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      JwtSettings__Secret: ${JWT_SECRET:-una-chiave-segreta-lunga-almeno-32-caratteri-cambiala}
      JwtSettings__Issuer: "Ecommerce.Utenti"
      JwtSettings__Audience: "Ecommerce"
      JwtSettings__ExpirationMinutes: "60"
      Kafka__Enable: "true"
      Kafka__AdminClient__BootstrapServers: "kafka:29092"
      Kafka__ProducerClient__BootstrapServers: "kafka:29092"
      Kafka__ProducerService__DelaySeconds: "10"
      Kafka__ProducerService__IntervalSeconds: "60"
      Kafka__Topics__UtenteRegistrato: "UtenteRegistrato"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  magazzino-webapi:
    build:
      context: .
      dockerfile: src/Services/Magazzino/Magazzino.WebApi/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: ecommerce-magazzino-webapi
    ports:
      - "5031:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MagazzinoDb: "Host=postgres;Port=5432;Database=magazzino_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Kafka__Enable: "true"
      Kafka__AdminClient__BootstrapServers: "kafka:29092"
      Kafka__ProducerClient__BootstrapServers: "kafka:29092"
      Kafka__ConsumerClient__BootstrapServers: "kafka:29092"
      Kafka__ConsumerClient__GroupId: "magazzino-consumer-group"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ordini-webapi:
    build:
      context: .
      dockerfile: src/Services/Ordini/Ordini.WebApi/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: ecommerce-ordini-webapi
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrdiniDb: "Host=postgres;Port=5432;Database=ordini_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Kafka__Enable: "true"
      Kafka__AdminClient__BootstrapServers: "kafka:29092"
      Kafka__ProducerClient__BootstrapServers: "kafka:29092"
      Kafka__ProducerService__DelaySeconds: "5"
      Kafka__ProducerService__IntervalSeconds: "30"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Approvvigionamento e Pagamenti: al momento i WebApi sono ancora il template
  # "weatherforecast" e non hanno un Dockerfile. Decommenta quando saranno pronti.
  #
  # approvvigionamento-webapi:
  #   build:
  #     context: .
  #     dockerfile: src/Services/Approvvigionamento/Approvvigionamento.WebApi/Dockerfile
  #     args:
  #       GITHUB_TOKEN: ${GITHUB_TOKEN}
  #   container_name: ecommerce-approvvigionamento-webapi
  #   ports:
  #     - "5093:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Development
  #     ConnectionStrings__ApprovvigionamentoDb: "Host=postgres;Port=5432;Database=approvvigionamento_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
  #     Kafka__Enable: "true"
  #     Kafka__ConsumerClient__BootstrapServers: "kafka:29092"
  #     Kafka__ConsumerClient__GroupId: "approvvigionamento-consumer-group"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy

  # ---------------------------------------------------------------- gateway e frontend
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Ecommerce.Gateway/Dockerfile
    container_name: ecommerce-gateway
    ports:
      - "5168:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # In container "localhost" non è il servizio Utenti: sovrascrivo gli indirizzi del file appsettings.json
      ReverseProxy__Clusters__utenti-cluster__Destinations__utenti-destination__Address: "http://utenti-webapi:8080"
      ReverseProxy__Clusters__magazzino-cluster__Destinations__magazzino-destination__Address: "http://magazzino-webapi:8080"
      ReverseProxy__Clusters__ordini-cluster__Destinations__ordini-destination__Address: "http://ordini-webapi:8080"
    depends_on:
      - utenti-webapi
      - magazzino-webapi
      - ordini-webapi

  frontend:
    build:
      context: .
      dockerfile: src/Frontend/Ecommerce.Frontend/Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "8081:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  kafka_data:
